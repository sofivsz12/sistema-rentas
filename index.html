<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HogarRent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #f4f7f6;
    --tinta: #14262b;
    --suave: #5b6e72;
    --linea: #d8e1df;
    --acento: #0f7b6c;
    --acento-osc: #0b5c51;
    --alerta: #b3412f;
    --blanco: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--fondo);
    color: var(--tinta);
    line-height: 1.5;
  }
  header {
    background: var(--tinta);
    color: var(--blanco);
    padding: 28px 20px 0;
  }
  .contenedor { max-width: 920px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
  header p { margin: 0 0 20px; color: #a9c0c4; font-size: .95rem; }
  nav { display: flex; gap: 4px; }
  nav button {
    font: inherit; font-weight: 700; font-size: .95rem;
    background: transparent; color: #a9c0c4;
    border: 0; padding: 12px 20px; cursor: pointer;
    border-radius: 10px 10px 0 0;
  }
  nav button[aria-selected="true"] { background: var(--fondo); color: var(--tinta); }
  nav button:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid #7ad6c7; outline-offset: 2px;
  }
  main { padding: 28px 20px 60px; }
  h2 { font-size: 1.15rem; margin: 0 0 14px; }
  form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
    background: var(--blanco);
    border: 1px solid var(--linea);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 28px;
  }
  label { display: grid; gap: 4px; font-size: .8rem; font-weight: 700; color: var(--suave); }
  input {
    font: inherit; font-size: .95rem; color: var(--tinta);
    padding: 10px 12px; border: 1px solid var(--linea); border-radius: 8px; background: #fbfdfc;
  }
  .btn {
    font: inherit; font-weight: 700; cursor: pointer;
    background: var(--acento); color: var(--blanco);
    border: 0; border-radius: 8px; padding: 10px 18px; align-self: end;
  }
  .btn:hover { background: var(--acento-osc); }
  .btn:disabled { opacity: .6; cursor: wait; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--blanco); border: 1px solid var(--linea);
    border-radius: 12px; padding: 14px 16px;
  }
  .datos strong { display: block; font-size: 1rem; }
  .datos span { color: var(--suave); font-size: .88rem; }
  .eliminar {
    font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer;
    background: transparent; color: var(--alerta);
    border: 1px solid #e6c4bd; border-radius: 8px; padding: 6px 12px;
  }
  .eliminar:hover { background: #fbeeeb; }
  .vacio { color: var(--suave); padding: 22px; text-align: center; border: 1px dashed var(--linea); border-radius: 12px; }
  #mensaje {
    display: none; margin-bottom: 18px; padding: 12px 16px; border-radius: 10px;
    font-size: .92rem; font-weight: 500;
  }
  #mensaje.error { display: block; background: #fbeeeb; color: var(--alerta); border: 1px solid #e6c4bd; }
  #mensaje.ok { display: block; background: #e3f4f0; color: var(--acento-osc); border: 1px solid #b7e0d8; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="contenedor">
    <h1>HogarRent</h1>
    <p>Gestión de rentas inmobiliarias</p>
    <nav role="tablist">
      <button role="tab" id="tab-clientes" aria-selected="true" aria-controls="panel-clientes">Clientes</button>
      <button role="tab" id="tab-propiedades" aria-selected="false" aria-controls="panel-propiedades">Propiedades</button>
    </nav>
  </div>
</header>

<main class="contenedor">
  <div id="mensaje" role="status"></div>

  <section id="panel-clientes" role="tabpanel" aria-labelledby="tab-clientes">
    <h2>Registrar cliente</h2>
    <form id="form-cliente">
      <label>Nombre(s) <input id="c-nombre" required placeholder="Ana"></label>
      <label>Apellidos <input id="c-apellido" required placeholder="López"></label>
      <label>Teléfono <input id="c-telefono" type="tel" inputmode="numeric" placeholder="8112345678"></label>
      <label>Correo <input id="c-correo" type="email" placeholder="ana@correo.com"></label>
      <button class="btn" type="submit">Agregar cliente</button>
    </form>
    <h2>Clientes registrados</h2>
    <ul id="lista-clientes"></ul>
  </section>

  <section id="panel-propiedades" role="tabpanel" aria-labelledby="tab-propiedades" hidden>
    <h2>Registrar propiedad</h2>
    <form id="form-propiedad">
      <label>Nombre <input id="p-nombre" required placeholder="Casa Los Pinos"></label>
      <label>Tipo <input id="p-tipo" required placeholder="Casa, departamento, local…"></label>
      <label>Enlace de foto <input id="p-foto" type="url" placeholder="https://…"></label>
      <button class="btn" type="submit">Agregar propiedad</button>
    </form>
    <h2>Propiedades en renta</h2>
    <ul id="lista-propiedades"></ul>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://saoisagskkdcmfnxqvmi.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhb2lzYWdza2tkY21mbnhxdm1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMjEzMjYsImV4cCI6MjEwOTU5NzMyNn0.opnjF_h9fvXGOox0_wijZ0ws00jcauVpitKcmECBHqo";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function aviso(texto, tipo) {
    const m = $("mensaje");
    m.textContent = texto;
    m.className = tipo;
    if (tipo === "ok") setTimeout(() => { m.className = ""; }, 2500);
  }

  function mostrar(cual) {
    ["clientes", "propiedades"].forEach((n) => {
      $("tab-" + n).setAttribute("aria-selected", n === cual);
      $("panel-" + n).hidden = n !== cual;
    });
    $("mensaje").className = "";
  }
  $("tab-clientes").onclick = () => mostrar("clientes");
  $("tab-propiedades").onclick = () => mostrar("propiedades");

  async function cargarClientes() {
    const { data, error } = await db.from("coustomers_info")
      .select("id_coustomers, first_name, last_name, phone_number, email")
      .order("id_coustomers", { ascending: false });
    if (error) return aviso("No se pudieron cargar los clientes: " + error.message, "error");

    const ul = $("lista-clientes");
    if (!data.length) {
      ul.innerHTML = '<li class="vacio" style="display:block">Aún no hay clientes. Agrega el primero con el formulario.</li>';
      return;
    }
    ul.innerHTML = data.map((c) => `
      <li>
        <div class="datos">
          <strong>${esc(c.first_name)} ${esc(c.last_name)}</strong>
          <span>${esc(c.phone_number ?? "Sin teléfono")} · ${esc(c.email || "Sin correo")}</span>
        </div>
        <button class="eliminar" data-id="${c.id_coustomers}">Eliminar</button>
      </li>`).join("");
  }

  $("form-cliente").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true;
    const tel = $("c-telefono").value.replace(/\D/g, "");
    const { error } = await db.from("coustomers_info").insert({
      first_name: $("c-nombre").value.trim(),
      last_name: $("c-apellido").value.trim(),
      phone_number: tel ? Number(tel) : null,
      email: $("c-correo").value.trim() || null,
      status: "activo"
    });
    btn.disabled = false;
    if (error) return aviso("No se pudo guardar el cliente: " + error.message, "error");
    e.target.reset();
    aviso("Cliente agregado", "ok");
    cargarClientes();
  });

  $("lista-clientes").addEventListener("click", async (e) => {
    const id = e.target.dataset.id;
    if (!id || !confirm("¿Eliminar este cliente?")) return;
    const { error } = await db.from("coustomers_info").delete().eq("id_coustomers", id);
    if (error) return aviso("No se pudo eliminar: " + error.message, "error");
    aviso("Cliente eliminado", "ok");
    cargarClientes();
  });

  async function cargarPropiedades() {
    const { data, error } = await db.from("propierties_for_rent")
      .select("id_propierty, name, type, photo_one")
      .order("id_propierty", { ascending: false });
    if (error) return aviso("No se pudieron cargar las propiedades: " + error.message, "error");

    const ul = $("lista-propiedades");
    if (!data.length) {
      ul.innerHTML = '<li class="vacio" style="display:block">Aún no hay propiedades. Agrega la primera con el formulario.</li>';
      return;
    }
    ul.innerHTML = data.map((p) => `
      <li>
        <div class="datos">
          <strong>${esc(p.name)}</strong>
          <span>${esc(p.type || "Sin tipo")}${p.photo_one ? ` · <a href="${esc(p.photo_one)}" target="_blank" rel="noopener">Ver foto</a>` : ""}</span>
        </div>
        <button class="eliminar" data-id="${p.id_propierty}">Eliminar</button>
      </li>`).join("");
  }

  $("form-propiedad").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true;
    const { error } = await db.from("propierties_for_rent").insert({
      name: $("p-nombre").value.trim(),
      type: $("p-tipo").value.trim(),
      photo_one: $("p-foto").value.trim() || null
    });
    btn.disabled = false;
    if (error) return aviso("No se pudo guardar la propiedad: " + error.message, "error");
    e.target.reset();
    aviso("Propiedad agregada", "ok");
    cargarPropiedades();
  });

  $("lista-propiedades").addEventListener("click", async (e) => {
    const id = e.target.dataset.id;
    if (!id || !confirm("¿Eliminar esta propiedad?")) return;
    const { error } = await db.from("propierties_for_rent").delete().eq("id_propierty", id);
    if (error) return aviso("No se pudo eliminar: " + error.message, "error");
    aviso("Propiedad eliminada", "ok");
    cargarPropiedades();
  });

  cargarClientes();
  cargarPropiedades();
</script>
</body>
</html>
