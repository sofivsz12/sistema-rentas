<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HogarRent</title>
<style>
:root{--f:#f4f7f6;--t:#14262b;--s:#5b6e72;--l:#d8e1df;--a:#0f7b6c;--r:#b3412f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--f);color:var(--t);line-height:1.5}
header{background:var(--t);color:#fff;padding:24px 20px 0}
.w{max-width:920px;margin:0 auto}
h1{margin:0 0 14px;font-size:1.8rem;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{font:inherit;font-weight:700;background:none;color:#a9c0c4;border:0;padding:11px 16px;cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap}
nav button[aria-selected=true]{background:var(--f);color:var(--t)}
main{padding:26px 20px 60px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;background:#fff;border:1px solid var(--l);border-radius:14px;padding:18px;margin-bottom:24px}
#login{max-width:380px;margin:30px auto}
label{display:grid;gap:4px;font-size:.8rem;font-weight:700;color:var(--s)}
input,select{font:inherit;font-size:.95rem;padding:10px 12px;border:1px solid var(--l);border-radius:8px;background:#fbfdfc;color:var(--t);width:100%}
.b{font:inherit;font-weight:700;cursor:pointer;background:var(--a);color:#fff;border:0;border-radius:8px;padding:10px 18px;align-self:end}
.b:disabled{opacity:.6}
.b2{font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;background:none;color:#a9c0c4;border:1px solid #4a6368;border-radius:8px;padding:6px 12px}
#login .b2{color:var(--a);border-color:var(--a);padding:10px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px 16px}
li b{display:block}li span{color:var(--s);font-size:.88rem}
.x{font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;background:none;color:var(--r);border:1px solid #e6c4bd;border-radius:8px;padding:6px 12px}
.v{color:var(--s);justify-content:center;border-style:dashed}
#msg{display:none;margin-bottom:16px;padding:12px 16px;border-radius:10px;font-size:.92rem}
#msg.error{display:block;background:#fbeeeb;color:var(--r);border:1px solid #e6c4bd}
#msg.ok{display:block;background:#e3f4f0;color:#0b5c51;border:1px solid #b7e0d8}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="w">
  <h1>HogarRent <span><button id="ir" class="b2">Iniciar sesión</button> <button id="salir" class="b2" hidden>Cerrar sesión</button></span></h1>
  <nav id="nav" hidden></nav>
</div></header>

<main class="w">
  <div id="msg" role="status"></div>
  <form id="login" hidden>
    <h2 style="margin:0">Iniciar sesión</h2>
    <label>Correo <input id="lc" type="email" required></label>
    <label>Contraseña <input id="lp" type="password" required minlength="6"></label>
    <button class="b">Entrar</button>
    <button type="button" id="reg" class="b2">Crear cuenta</button>
  </form>
  <section id="cat">
    <h2>Propiedades disponibles</h2>
    <form id="interes" hidden>
      <b id="i-t" style="grid-column:1/-1"></b><input type="hidden" id="i-prop">
      <label>Nombre <input id="i-nom" required></label>
      <label>Correo <input id="i-email" type="email" required></label>
      <label>Teléfono <input id="i-tel" type="tel"></label>
      <label>Mensaje <input id="i-msg" placeholder="Fechas, dudas…"></label>
      <button class="b">Enviar</button>
    </form>
    <ul id="lcat"></ul>
  </section>
  <div id="app" hidden></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://saoisagskkdcmfnxqvmi.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhb2lzYWdza2tkY21mbnhxdm1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMjEzMjYsImV4cCI6MjEwOTU5NzMyNn0.opnjF_h9fvXGOox0_wijZ0ws00jcauVpitKcmECBHqo";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = i => document.getElementById(i);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const aviso = (x, t) => { const m = $("msg"); m.textContent = x; m.className = t; if (t == "ok") setTimeout(() => m.className = "", 2500); };
const C = {};
const lab = (n, id) => { const r = C[n].find(r => r[E[n].id] == id); return r ? E[n].tit(r) : "—"; };
const DIR = ["country","state","municipality","neighborhood","street","house_number"];

const E = {
  clientes: { n:"Clientes", s:"cliente", t:"coustomers_info", id:"id_coustomers",
    f:[["first_name","Nombre","text",1],["last_name","Apellido","text",1],["phone_number","Teléfono","num"],["email","Correo","email"]],
    fijo:{status:"activo"},
    tit:r=>`${r.first_name} ${r.last_name}`,
    sub:r=>`${r.phone_number ?? "Sin teléfono"} · ${r.email || "Sin correo"}` },
  propiedades: { n:"Propiedades", s:"propiedad", t:"propierties_for_rent", id:"id_propierty",
    q:"*, propieties_info(address_propiety(street,house_number,neighborhood,municipality,state))",
    f:[["name","Nombre","text",1],["type","Tipo","text",1],["photo_one","Enlace de foto","url"],["street","Calle","text",1],["house_number","Número","num"],["neighborhood","Colonia","text"],["municipality","Municipio","text"],["state","Estado","text"],["country","País","text",1,"México"]],
    tit:r=>r.name,
    sub:r=>{ const a = r.propieties_info?.address_propiety;
      return r.type + " · " + (a ? [[a.street,a.house_number].filter(Boolean).join(" "),a.neighborhood,a.municipality,a.state].filter(Boolean).join(", ") : "Sin dirección"); },
    ins: async o => {
      const a = {}; DIR.forEach(k => { a[k] = o[k]; delete o[k]; });
      const r1 = await db.from("address_propiety").insert(a).select("id_address").single(); if (r1.error) return r1;
      const r2 = await db.from("propieties_info").insert({id_address:r1.data.id_address}).select("id_propieties_info").single(); if (r2.error) return r2;
      o.id_propieties_info = r2.data.id_propieties_info;
      return db.from("propierties_for_rent").insert(o);
    } },
  contratos: { n:"Contratos", s:"contrato", t:"rental_agreements", id:"id_agreements",
    f:[["id_property","Propiedad","sel",1,null,"propiedades"],["id_coustomers","Cliente","sel",1,null,"clientes"],["start_date","Inicio","date",1],["end_date","Fin","date",1],["monthly_rent","Renta mensual","num",1],["security_deposit","Depósito","num"],["payment_due_day","Día de pago","num"]],
    fijo:{status:"activo"},
    val:o=> o.end_date <= o.start_date ? "La fecha de fin debe ser posterior al inicio." :
      C.contratos.some(c => c.id_property == o.id_property && c.status == "activo") ? "Esa propiedad ya tiene un contrato activo." : null,
    tit:r=>`${lab("propiedades",r.id_property)} ↔ ${lab("clientes",r.id_coustomers)}`,
    sub:r=>`${r.start_date} a ${r.end_date} · $${r.monthly_rent}/mes · ${r.status}` },
  pagos: { n:"Pagos", s:"pago", t:"payments_rentals", id:"id_payments",
    f:[["id_agreements","Contrato","sel",1,null,"contratos"],["amount","Monto","num",1],["currency","Moneda","text",0,"MXN"],["payment_date","Fecha de pago","date"],["due_date","Vencimiento","date"],["payment_method","Método de pago","text"],["transaction_reference","Referencia","text"]],
    fijo:{status:"pagado"},
    ins: o => { o.id_coustomers = C.contratos.find(c => c.id_agreements == o.id_agreements)?.id_coustomers; return db.from("payments_rentals").insert(o); },
    tit:r=>`$${r.amount} ${r.currency || ""} · ${lab("contratos",r.id_agreements)}`,
    sub:r=>`${r.status} · ${r.payment_date || "sin fecha"}${r.payment_method ? " · " + r.payment_method : ""}` },
  interesados: { n:"Interesados", s:"interesado", t:"property_viewings", id:"id",
    f:[["full_name","Nombre","text",1],["email","Correo","email"],["phone_number","Teléfono","num"],["id_propierty","Propiedad","sel",1,null,"propiedades"],["message","Mensaje","text"]],
    tit:r=>r.full_name,
    sub:r=>`${lab("propiedades",r.id_propierty)} · ${r.email || "sin correo"} · ${r.phone_number ?? "sin teléfono"}${r.message ? " · " + r.message : ""}` }
};

function armar() {
  $("nav").innerHTML = Object.keys(E).map((n,i) => `<button data-n="${n}" aria-selected="${i==0}">${E[n].n}</button>`).join("");
  $("app").innerHTML = Object.keys(E).map((n,i) => `<section id="p-${n}" ${i ? "hidden" : ""}>
    <form data-n="${n}">${E[n].f.map(([k,l,t,r,v]) => `<label>${l}${t == "sel"
      ? `<select id="${n}-${k}" ${r ? "required" : ""}></select>`
      : `<input id="${n}-${k}" type="${t == "num" ? "number" : t}" ${t == "num" ? 'step="any"' : ""} ${r ? "required" : ""} value="${v || ""}">`}</label>`).join("")}
    <button class="b">Agregar ${E[n].s}</button></form><ul id="l-${n}"></ul></section>`).join("");
}

function pintar() {
  for (const n in E) {
    E[n].f.forEach(([k,,t,,,s]) => { if (t == "sel") {
      const el = $(`${n}-${k}`), v = el.value;
      el.innerHTML = '<option value="">Selecciona…</option>' + C[s].map(r => `<option value="${r[E[s].id]}">${esc(E[s].tit(r))}</option>`).join("");
      el.value = v; } });
    $("l-" + n).innerHTML = C[n].length
      ? C[n].map(r => `<li><div><b>${esc(E[n].tit(r))}</b><span>${esc(E[n].sub(r))}</span></div><button class="x" data-n="${n}" data-id="${r[E[n].id]}">Eliminar</button></li>`).join("")
      : '<li class="v">Aún no hay registros.</li>';
  }
}

async function cargar() {
  for (const n in E) {
    const { data, error } = await db.from(E[n].t).select(E[n].q || "*").order(E[n].id, { ascending:false });
    if (error) return aviso(`No se pudo cargar ${E[n].n}: ${error.message}`, "error");
    C[n] = data;
  }
  pintar();
}

const ADMIN_EMAIL = "fofyy1206@gmail.com";
let verLogin = false;
db.auth.onAuthStateChange((_, ses) => {
  const on = !!ses, adm = on && ses.user.email === ADMIN_EMAIL;
  $("login").hidden = on || !verLogin; $("ir").hidden = on; $("salir").hidden = !on;
  $("app").hidden = !adm; $("nav").hidden = !adm; $("cat").hidden = adm;
  if (adm) { if (!$("app").innerHTML) armar(); cargar(); } else catalogo();
});
$("ir").onclick = () => { verLogin = true; $("login").hidden = false; };

async function catalogo() {
  const { data, error } = await db.from("propierties_for_rent").select(E.propiedades.q).order("id_propierty", { ascending:false });
  if (error) return aviso("No se pudo cargar el catálogo: " + error.message, "error");
  C.cat = data;
  $("lcat").innerHTML = data.length ? data.map(r => `<li>${r.photo_one ? `<img src="${esc(r.photo_one)}" alt="" style="width:84px;height:64px;object-fit:cover;border-radius:8px">` : ""}<div style="flex:1"><b>${esc(r.name)}</b><span>${esc(E.propiedades.sub(r))}</span></div><button class="b" data-i="${r.id_propierty}">Me interesa</button></li>`).join("") : '<li class="v">Aún no hay propiedades publicadas.</li>';
}
$("interes").onsubmit = async e => {
  e.preventDefault();
  const tel = $("i-tel").value.replace(/\D/g, "");
  const { error } = await db.from("property_viewings").insert({
    id_propierty: Number($("i-prop").value), full_name: $("i-nom").value.trim(), email: $("i-email").value.trim(),
    phone_number: tel ? Number(tel) : null, message: $("i-msg").value.trim() || null });
  if (error) return aviso("No se pudo enviar: " + error.message, "error");
  e.target.reset(); e.target.hidden = true; aviso("¡Listo! Recibimos tu interés y te contactaremos pronto.", "ok");
};
$("login").onsubmit = async e => {
  e.preventDefault();
  const { error } = await db.auth.signInWithPassword({ email:$("lc").value.trim(), password:$("lp").value });
  if (error) aviso("No se pudo iniciar sesión: " + error.message, "error");
};
$("reg").onclick = async () => {
  if (!$("lc").value.trim() || $("lp").value.length < 6) return aviso("Escribe tu correo y una contraseña de al menos 6 caracteres.", "error");
  const { data, error } = await db.auth.signUp({ email:$("lc").value.trim(), password:$("lp").value });
  if (error) return aviso(error.message, "error");
  aviso(data.session ? "Cuenta creada" : "Cuenta creada. Revisa tu correo para confirmarla.", "ok");
};
$("salir").onclick = () => { verLogin = false; db.auth.signOut(); };

document.addEventListener("submit", async e => {
  const f = e.target, n = f.dataset.n; if (!n) return;
  e.preventDefault();
  const d = E[n], o = { ...d.fijo };
  d.f.forEach(([k,,t]) => { const v = $(`${n}-${k}`).value.trim(); o[k] = v === "" ? null : (t == "num" || t == "sel") ? Number(v) : v; });
  const m = d.val && d.val(o); if (m) return aviso(m, "error");
  const btn = e.submitter; btn.disabled = true;
  const { error } = await (d.ins ? d.ins(o) : db.from(d.t).insert(o));
  btn.disabled = false;
  if (error) return aviso("No se pudo guardar: " + error.message, "error");
  f.reset(); aviso("Registro agregado", "ok"); cargar();
});

document.addEventListener("click", async e => {
  const mi = e.target.dataset.i;
  if (mi) {
    $("interes").hidden = false; $("i-prop").value = mi;
    $("i-t").textContent = "Me interesa: " + C.cat.find(r => r.id_propierty == mi).name;
    $("interes").scrollIntoView({ behavior:"smooth" }); return;
  }
  const tab = e.target.closest("#nav button");
  if (tab) {
    document.querySelectorAll("#nav button").forEach(x => x.setAttribute("aria-selected", x == tab));
    Object.keys(E).forEach(n => $("p-" + n).hidden = n != tab.dataset.n);
    $("msg").className = ""; return;
  }
  if (e.target.classList.contains("x")) {
    if (!confirm("¿Eliminar este registro?")) return;
    const d = E[e.target.dataset.n];
    const { error } = await db.from(d.t).delete().eq(d.id, e.target.dataset.id);
    if (error) return aviso("No se pudo eliminar: " + error.message, "error");
    aviso("Registro eliminado", "ok"); cargar();
  }
});
</script>
</body>
</html>
